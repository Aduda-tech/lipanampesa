# Render blueprint — one-click deploy of the multi-shop backend.
# Dashboard: New → Blueprint → point at this repo. Render reads this file.
services:
  - type: web
    name: lipa-na-mpesa-shop
    runtime: node
    plan: starter            # persistent disk requires a paid plan; see docs/DEPLOY_CLOUD.md
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random secret
      - key: DARAJA_MOCK
        value: "true"         # platform fallback: shops start in demo mode anyway
      - key: DB_FILE
        value: /var/data/shop.db
    disk:
      name: shopdata
      mountPath: /var/data
      sizeGB: 1

# PUBLIC_URL is filled in automatically by Render via RENDER_EXTERNAL_URL —
# the app reads it in backend/src/config.js. No action needed.
