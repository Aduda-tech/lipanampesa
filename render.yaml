# ─────────────────────────────────────────────────────────────────────────────
# Render blueprint — deploy of the multi-shop Lipa na M-Pesa backend.
#
# DEFAULT = FREE TESTING DEPLOY (no card required).
# Production upgrade (SQLite survives restarts): see the commented block below.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: lipa-na-mpesa-shop
    runtime: node
    plan: free                 # <-- free testing tier, no payment info needed
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong random secret
      - key: DARAJA_MOCK
        value: "true"          # platform fallback: all shops start in demo mode

# PUBLIC_URL is filled in automatically by Render via RENDER_EXTERNAL_URL.

